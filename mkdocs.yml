          - Curves and Surfaces: getting-started/basics.geometry.curves_and_surfaces.md
          - Polygons and Polyhedra: getting-started/basics.geometry.polygons_and_polyhedrons.md
          - Solids: getting-started/basics.geometry.solids.md
          - Transformations: getting-started/basics.geometry.transformations.md
          - Distance and Membership: getting-started/basics.geometry.distance_and_membership.md
          - Intersections: getting-started/basics.geometry.intersections.md
      - Data Structures:
