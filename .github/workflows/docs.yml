name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, remove-future, initiative/repository-modernisation]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          extras: docs
          dependency-groups: ""
          config-file: mkdocs.yml
          strict: true
