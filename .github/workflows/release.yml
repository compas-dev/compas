on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]  # ubuntu-24.04 is the last image with Python 3.9
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: compas-dev/compas-actions.build@v4
        with:
          invoke_lint: true
          invoke_test: true
          python: ${{ matrix.python }}
          check_import: true

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_ghpython_components: true
          gh_source: src/compas_ghpython/components
          gh_target: src/compas_ghpython/components/ghuser
          release_name_prefix: COMPAS

  blender_extension:
    needs: build
    uses: ./.github/workflows/blender_extension.yml

  attach_blender_extension:
    needs: [publish, blender_extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blender-extension
          path: dist/blender

      - name: Attach Blender extension packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/blender/*.zip --repo "${{ github.repository }}" --clobber
