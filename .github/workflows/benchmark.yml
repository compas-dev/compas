name: serialization-benchmark

# Runs the serialization benchmark and uploads the results (CSV + HTML report + encoded
# samples) as a downloadable workflow artifact.
#
# PR runs always use the `quick` preset. Their *size* and *losslessness* numbers are
# deterministic and meaningful; the *timing* numbers are only indicative on a shared runner —
# use workflow_dispatch (or a dedicated machine) when the exact timings matter.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      preset:
        description: "Corpus size preset"
        type: choice
        options: [quick, full]
        default: quick
      repeat:
        description: "Timed runs per measurement (median reported)"
        default: "5"
      compas_pb_ref:
        description: "compas_pb git ref to benchmark (branch/tag/sha)"
        default: "perf/round-trip"
      formats:
        description: "formats to benchmark (json, json_zip, compas_pb, compas_pb_zip, compas_pb_zstd, compas_msgpack, compas_msgpack_zstd)"
        default: "json compas_pb"

permissions:
  contents: read

# One run per ref; a new commit cancels the previous run for the same PR.
concurrency:
  group: serialization-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compas + benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Optional benchmark formats (skipped automatically if absent, but we want them here):
          pip install msgspec zstandard
          # The optimized compas_pb under test. Its generated _pb2 modules are committed, so no
          # protoc is needed. Public repo -> no auth required.
          pip install "compas_pb @ git+https://github.com/gramaziokohler/compas_pb.git@${{ inputs.compas_pb_ref || 'main' }}"

      - name: Show versions
        run: |
          python -c "import compas, compas_pb, msgspec, zstandard; print('compas', compas.__version__); print('compas_pb', compas_pb.__version__)"

      - name: Run benchmark (${{ inputs.preset || 'quick' }})
        run: |
          python -m benchmarks.serialization.run \
            --preset "${{ inputs.preset || 'quick' }}" \
            --repeat "${{ inputs.repeat || '5' }}" \
            --formats "${{ inputs.formats || 'json compas_pb' }}" \
            --out "${{ runner.temp }}/serialization-results/baseline_${{ inputs.preset || 'quick' }}.csv"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: serialization-benchmark-${{ inputs.preset || 'quick' }}-${{ github.run_number }}
          # Upload only this run's clean output. The repository also tracks historical
          # baselines, which must not leak into a quick run's artifact.
          path: ${{ runner.temp }}/serialization-results/
          retention-days: 90
          if-no-files-found: error
