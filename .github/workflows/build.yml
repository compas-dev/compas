name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        id: release

  build:
    needs: release-change
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'docs-only') &&
      (github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          extras: dev
      - name: Check style
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check typing
        run: uv run pyright
      - name: Run tests
        run: uv run pytest
