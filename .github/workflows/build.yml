name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, initiative/repository-modernisation]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        id: release

  build:
    needs: release-change
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'docs-only') &&
      (github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: ${{ matrix.python }}
          # Pyright covers the authoritative visualization examples as part of
          # the public documentation contract, so their declared dependencies
          # must be present in the typing environment.
          extras: dev,viz
      - name: Check style
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check typing
        run: uv run pyright
      - name: Run tests
        run: uv run pytest
      - name: Build typed wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/compas-source" "${RUNNER_TEMP}/compas-wheelhouse"
          git archive HEAD | tar -xf - -C "${RUNNER_TEMP}/compas-source"
          uv run python -m build \
            --wheel \
            --outdir "${RUNNER_TEMP}/compas-wheelhouse" \
            "${RUNNER_TEMP}/compas-source"
      - name: Verify typed wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          uv run python .github/verify_python_wheel.py "${RUNNER_TEMP}/compas-wheelhouse"
          uv venv "${RUNNER_TEMP}/compas-wheel"
          uv pip install \
            --python "${RUNNER_TEMP}/compas-wheel/bin/python" \
            "${RUNNER_TEMP}/compas-wheelhouse"/*.whl
          (
            cd "${RUNNER_TEMP}"
            "${GITHUB_WORKSPACE}/.venv/bin/pyright" \
              --pythonpath "${RUNNER_TEMP}/compas-wheel/bin/python" \
              "${GITHUB_WORKSPACE}/tests/typing/installed_consumer.py"
          )
      - name: Upload verified candidate wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-py312
          path: ${{ runner.temp }}/compas-wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  numpy-compatibility:
    name: NumPy ${{ matrix.numpy }}
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy: [minimum, current]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: compas-dev/compas-actions/setup-python@5c64e6e2b576a1232d28fed47d9478ca8eb63b2d # v2 candidate
        with:
          python-version: "3.12"
          frozen: "true"
          dependency-groups: ""
          extras: dev
      - name: Resolve minimum supported NumPy
        if: matrix.numpy == 'minimum'
        run: uv pip compile pyproject.toml --extra dev --constraint .github/constraints/numpy-min.txt --output-file ${{ runner.temp }}/compas-numpy-min.txt
      - name: Test minimum supported NumPy
        if: matrix.numpy == 'minimum'
        # Static typing fixtures are checked in the locked build. NumPy 1.26
        # exposes older ndarray generic shape metadata than the current release.
        run: uv run --isolated --no-project --with-requirements ${{ runner.temp }}/compas-numpy-min.txt --with-editable . python -m pytest --ignore=tests/compas/test_typing_fixtures.py
      - name: Resolve current NumPy
        if: matrix.numpy == 'current'
        run: uv pip compile pyproject.toml --extra dev --upgrade --output-file ${{ runner.temp }}/compas-numpy-current.txt
      - name: Test current NumPy
        if: matrix.numpy == 'current'
        run: uv run --isolated --no-project --with-requirements ${{ runner.temp }}/compas-numpy-current.txt --with-editable . python -m pytest
