name: blender_extension

# Builds the COMPAS Blender extension packages (one per Blender version range and platform)
# and uploads each package as its own, unzipped workflow artifact.
# Called by the release workflow, which attaches the packages to the GitHub release,
# and run on pull requests that touch the Blender integration.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "extensions/blender/**"
      - "src/compas_blender/**"
      - "requirements.txt"
      - ".github/workflows/blender_extension.yml"

env:
  # Any Blender >= 4.2 can build packages for all supported Blender versions.
  BLENDER_VERSION: "5.2.4"

jobs:
  build:
    name: build (Blender ${{ matrix.blender }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { blender: "4.2-5.0", python: "3.11", platform: windows-x64 }
          - { blender: "4.2-5.0", python: "3.11", platform: macos-arm64 }
          - { blender: "4.2-5.0", python: "3.11", platform: macos-x64 }
          - { blender: "4.2-5.0", python: "3.11", platform: linux-x64 }
          - { blender: "5.1+", python: "3.13", platform: windows-x64 }
          - { blender: "5.1+", python: "3.13", platform: windows-arm64 }
          - { blender: "5.1+", python: "3.13", platform: macos-arm64 }
          - { blender: "5.1+", python: "3.13", platform: linux-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libsm6 libice6 libgl1 libegl1

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -sSfL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ -C ~
          mv ~/blender-${BLENDER_VERSION}-linux-x64 ~/blender

      - name: Check Blender
        run: ~/blender/blender --version

      - name: Build extension package
        run: python extensions/blender/build.py --blender ~/blender/blender --python ${{ matrix.python }} --platform ${{ matrix.platform }}

      # Uploaded unzipped, so the artifact is the extension package itself (named after the file).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/blender/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  # Downloads the packages the same way the release workflow does, to catch problems before a release.
  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: compas-*.zip
          path: dist/blender
          merge-multiple: true
          skip-decompress: true

      - name: Check extension packages
        run: |
          ls -l dist/blender
          count=0
          for package in dist/blender/*.zip; do
            unzip -l "$package" | grep -q " blender_manifest.toml$" || { echo "::error::$package is not an extension package"; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -eq 8 ] || { echo "::error::Expected 8 extension packages, found $count"; exit 1; }
